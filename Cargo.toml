[workspace]
resolver = "3"
members = [
    "crates/overseer-core",
    "crates/overseer-store",
    "crates/overseer-backends",
    "crates/overseer-orchestrator",
    "crates/overseer-cli",
    "crates/ovs-event",
    "crates/ovs-state",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
get_unwrap = "deny"
