[package]
name = "overseer-cli"
description = "Command-line interface for overseer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "overseer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
overseer-core = { version = "0.1.0", path = "../overseer-core" }
overseer-store = { version = "0.1.0", path = "../overseer-store" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
