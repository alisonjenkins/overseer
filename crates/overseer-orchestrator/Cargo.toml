[package]
name = "overseer-orchestrator"
description = "Task execution: worktrees, runs and task status transitions"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
overseer-backends = { version = "0.1.0", path = "../overseer-backends" }
overseer-core = { version = "0.1.0", path = "../overseer-core" }
overseer-store = { version = "0.1.0", path = "../overseer-store" }
futures-util = "0.3"
globset = "0.4.16"
notify = "8"
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.52.3", features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
